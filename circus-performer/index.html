<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circus Performer</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Jost', sans-serif;
      background: #fff7f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      overflow: hidden;
    }

    .clown-wrap {
      width: min(320px, 80vw);
      animation: wobble 2.5s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-3deg); }
      50%       { transform: rotate(3deg); }
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      color: #c0392b;
      text-align: center;
      letter-spacing: -0.01em;
      line-height: 1.1;
      text-shadow: 3px 3px 0 #ffd700, 5px 5px 0 rgba(0,0,0,0.08);
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    a.home {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      text-decoration: none;
      margin-top: 1rem;
      transition: color 0.2s;
    }
    a.home:hover { color: #c0392b; }
  </style>
</head>
<body>

  <!-- confetti layer -->
  <div class="confetti" id="confetti"></div>

  <!-- clown SVG -->
  <div class="clown-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" aria-label="Clown illustration">
      <!-- hat -->
      <ellipse cx="100" cy="62" rx="52" ry="10" fill="#2c3e50"/>
      <rect x="72" y="18" width="56" height="46" rx="6" fill="#2c3e50"/>
      <ellipse cx="100" cy="18" rx="28" ry="8" fill="#c0392b"/>
      <!-- hat pompom -->
      <circle cx="100" cy="10" r="9" fill="#ffd700"/>
      <!-- hat stripe -->
      <rect x="72" y="36" width="56" height="8" fill="#e74c3c"/>

      <!-- head -->
      <ellipse cx="100" cy="110" rx="55" ry="58" fill="#fde8c8"/>
      <!-- hair left -->
      <ellipse cx="50" cy="105" rx="18" ry="22" fill="#e74c3c"/>
      <!-- hair right -->
      <ellipse cx="150" cy="105" rx="18" ry="22" fill="#e74c3c"/>

      <!-- eyes -->
      <ellipse cx="82" cy="100" rx="11" ry="13" fill="white"/>
      <ellipse cx="118" cy="100" rx="11" ry="13" fill="white"/>
      <circle cx="84" cy="102" r="6" fill="#2c3e50"/>
      <circle cx="120" cy="102" r="6" fill="#2c3e50"/>
      <circle cx="86" cy="100" r="2" fill="white"/>
      <circle cx="122" cy="100" r="2" fill="white"/>
      <!-- eyelashes -->
      <line x1="76" y1="89" x2="74" y2="85" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="82" y1="87" x2="82" y2="83" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="88" y1="89" x2="90" y2="85" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="112" y1="89" x2="110" y2="85" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="118" y1="87" x2="118" y2="83" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="124" y1="89" x2="126" y2="85" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/>

      <!-- nose -->
      <circle cx="100" cy="118" r="12" fill="#e74c3c"/>
      <circle cx="96" cy="115" r="3" fill="#ff8a80" opacity=".5"/>

      <!-- smile -->
      <path d="M76 136 Q100 158 124 136" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
      <!-- teeth -->
      <path d="M83 142 Q100 154 117 142 Q100 150 83 142Z" fill="white"/>

      <!-- cheek blush -->
      <ellipse cx="70" cy="125" rx="12" ry="7" fill="#ffb3ba" opacity=".6"/>
      <ellipse cx="130" cy="125" rx="12" ry="7" fill="#ffb3ba" opacity=".6"/>

      <!-- bow tie -->
      <polygon points="80,174 100,186 80,198" fill="#e74c3c"/>
      <polygon points="120,174 100,186 120,198" fill="#e74c3c"/>
      <circle cx="100" cy="186" r="7" fill="#ffd700"/>

      <!-- body -->
      <ellipse cx="100" cy="230" rx="46" ry="30" fill="#3498db"/>
      <!-- body polka dots -->
      <circle cx="88" cy="222" r="5" fill="#ffd700"/>
      <circle cx="108" cy="236" r="5" fill="#e74c3c"/>
      <circle cx="118" cy="220" r="4" fill="#ffd700"/>
      <circle cx="82" cy="238" r="4" fill="#2ecc71"/>

      <!-- collar -->
      <path d="M60 170 Q100 195 140 170 Q130 185 100 180 Q70 185 60 170Z" fill="white"/>
    </svg>
  </div>

  <h1>you got clowned!</h1>

  <a href="/" class="home">← back to safety</a>

  <script>
    const colours = ['#e74c3c','#ffd700','#3498db','#2ecc71','#9b59b6','#e67e22'];
    const container = document.getElementById('confetti');
    for (let i = 0; i < 40; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.cssText = `
        left:${Math.random()*100}%;
        width:${6+Math.random()*8}px;
        height:${6+Math.random()*8}px;
        background:${colours[Math.floor(Math.random()*colours.length)]};
        animation-duration:${2+Math.random()*4}s;
        animation-delay:${Math.random()*4}s;
        border-radius:${Math.random()>0.5?'50%':'2px'};
      `;
      container.appendChild(d);
    }
  </script>
</body>
</html>
