<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ned Telfer</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1E3A5F;
      --ink: #1A1818;
      --muted: #6A6660;
      --border: #DDD8CF;
      --bg: #F8F6F2;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(3rem, 8vw, 5.5rem);
      line-height: 1;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .tagline {
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 1rem;
    }

    .divider {
      width: 32px;
      height: 1px;
      background: var(--border);
      margin: 2.5rem auto;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      list-style: none;
    }

    nav a {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--muted);
      transition: color 0.2s;
    }

    nav a:hover { color: var(--navy); }

    .projects-wrapper {
      position: relative;
    }

    .projects-toggle {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: color 0.2s;
      font-family: 'Jost', sans-serif;
    }

    .projects-toggle:hover { color: var(--navy); }

    .projects-toggle svg {
      width: 8px;
      height: 8px;
      transition: transform 0.2s;
    }

    .projects-toggle.open svg {
      transform: rotate(180deg);
    }

    .dropdown {
      position: absolute;
      top: calc(100% + 1rem);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.6rem 0;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .dropdown.open {
      opacity: 1;
      pointer-events: all;
    }

    .dropdown a {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--muted);
      padding: 0.5rem 1.25rem;
      transition: color 0.2s;
    }

    .dropdown a:hover { color: var(--navy); }

    footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.7rem;
      color: var(--border);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="name">Ned Telfer</h1>
    <p class="tagline">Software · Neuroscience · Technical Analysis</p>

    <div class="divider"></div>

    <ul>
      <nav>
        <li><a href="/cv-ta">CV</a></li>
        <li><a href="/interests">Interests</a></li>
        <li class="projects-wrapper">
          <button class="projects-toggle" id="projects-btn" aria-haspopup="true" aria-expanded="false">
            Projects
            <svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M1 1l4 4 4-4"/>
            </svg>
          </button>
          <div class="dropdown" id="dropdown" role="menu">
            <a href="/wordlescape" role="menuitem">Wordlescape</a>
            <a href="/medidex" target="_blank" rel="noopener" role="menuitem">Medical Pokedex</a>
          </div>
        </li>
      </nav>
    </ul>
  </div>

  <footer>&copy; 2025 Ned Telfer</footer>

  <script>
    const btn = document.getElementById('projects-btn');
    const dd = document.getElementById('dropdown');

    btn.addEventListener('click', () => {
      const open = dd.classList.toggle('open');
      btn.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open);
    });

    document.addEventListener('click', (e) => {
      if (!btn.contains(e.target) && !dd.contains(e.target)) {
        dd.classList.remove('open');
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', false);
      }
    });
  </script>

</body>
</html>
